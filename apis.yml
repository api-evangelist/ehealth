aid: ehealth
name: eHealth
description: >-
  eHealth, Inc. (NASDAQ: EHTH) operates a licensed online health insurance
  marketplace where U.S. consumers can compare and enroll in health coverage
  from more than 180 insurance carriers across all 50 states and Washington,
  D.C. Founded in 1997, the company offers individual and family plans, Medicare
  products (Medicare Advantage, Medigap, and Part D prescription drug plans),
  small-business coverage, and Individual Coverage Health Reimbursement
  Arrangements (ICHRA). eHealth also provides a partner-facing developer API,
  documented at its gated developer portal, that lets affiliates and partners
  embed health-insurance shopping, quoting, and enrollment into their own
  applications.
